<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./view.js"></script>
  </head>
  <body>
    <main>
      <h1 id="title" data-i18n="title"></h1>
      <form>
        <label for="task" data-i18n="task"></label>
        <div class="actions">
          <input id="task" maxlength="160" required autocomplete="off" />
          <button data-i18n="add"></button>
        </div>
      </form>
      <ul id="tasks"></ul>
      <p id="status" role="status"></p>
    </main>
  </body>
</html>
