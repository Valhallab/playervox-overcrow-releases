    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
