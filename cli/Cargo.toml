[package]
name = "overcrow-widget-cli"
version = "1.0.0-beta.2"
description = "overcrow-widget: the creator CLI of OverCrow widget API v1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "overcrow-widget"
path = "src/main.rs"

# The public validators are reused, never copied. oxc parses, strips the
# TypeScript, minifies and prints the logic bundle; the module linker, the
# lint and the view table are this crate's own. oxc is pre-1.0 and breaks its
# API with each minor release: every oxc crate is pinned to the same exact
# version, and an upgrade is an explicit change with new measurements
# (docs/content/en/cli.md, docs/cli.md).
[dependencies]
overcrow-widget-devchannel = { path = "../crates/overcrow-widget-devchannel" }
overcrow-widget-format = { path = "../crates/overcrow-widget-format" }
overcrow-widget-scenario = { path = "../crates/overcrow-widget-scenario" }
overcrow-widget-schema = { path = "../crates/overcrow-widget-schema" }
# `test`: reference images (PNG within the scenario bounds) and the
# runtime's work directory. Both already locked for the marketplace tool.
image.workspace = true
sha2.workspace = true
tempfile.workspace = true
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_codegen = "=0.152.0"
oxc_compat = "=0.152.0"
oxc_diagnostics = "=0.152.0"
oxc_ecmascript = "=0.152.0"
oxc_minifier = "=0.152.0"
oxc_parser = "=0.152.0"
oxc_semantic = "=0.152.0"
oxc_span = "=0.152.0"
oxc_str = "=0.152.0"
oxc_syntax = "=0.152.0"
oxc_transformer = "=0.152.0"
serde_json = { workspace = true, features = ["std"] }
# `test` downloads the pinned runtime from its OverCrow release
# (src/download.rs): HTTPS through rustls with the ring provider and the
# Mozilla roots, no compression feature (the archive is already deflated).
# flate2 and crc32fast are already locked through png; they read the
# creator tools ZIP (src/zipread.rs).
crc32fast = "=1.5.0"
flate2 = "=1.1.10"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }

# The development channel's socket peer check and Ctrl+C (`dev`, `doctor`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The development channel's pipe, the overlay's token and Ctrl+C.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
