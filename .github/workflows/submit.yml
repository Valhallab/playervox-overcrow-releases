name: overcrow-submit

# Submits PlayerVox's own widgets (widgets/*) to the OverCrow creator space
# after every merge on main, with the overcrow-widget CLI of the same
# commit and one publish key covering them, kept as the secret of the
# overcrow-submit environment (deployments from main only). A version the
# creator space already has is not sent again. Every version still goes
# through a person's review, then a signed catalog, before players get it.
#
# Merges submit only once the repository variable OVERCROW_SUBMIT is `on`;
# a manual run (optionally a dry run, which sends nothing) always works.
on:
  push:
    branches: [main]
    paths:
      - "widgets/**"
      - ".github/workflows/submit.yml"
      - "scripts/submit-widgets.mjs"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check every widget as the creator space will, send nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: overcrow-submit
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.repository == 'Valhallab/playervox-overcrow-releases'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || vars.OVERCROW_SUBMIT == 'on')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: overcrow-submit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Restore the build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: overcrow-submit-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            overcrow-submit-${{ runner.os }}-rust-1.98-
      - name: Build overcrow-widget from this commit
        run: cargo build --locked --release -p overcrow-widget-cli
      - name: Submit the widgets
        env:
          OVERCROW_PUBLISH_KEY: ${{ secrets.OVERCROW_PUBLISH_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/submit-widgets.mjs --cli target/release/overcrow-widget $DRY_RUN
