name: contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
          key: contract-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            contract-${{ runner.os }}-rust-1.98-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -p overcrow-widget-schema --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p overcrow-widget-schema --all-targets --locked
      - name: Require regenerated reference and fixtures
        run: |
          cargo run -p overcrow-widget-schema --locked --example reference \
            > docs/widget-schema-v1.md
          cargo run -p overcrow-widget-schema --locked --example fixtures
          git diff --exit-code -- docs/widget-schema-v1.md crates/overcrow-widget-schema
          test -z "$(git status --porcelain -- crates/overcrow-widget-schema)"
