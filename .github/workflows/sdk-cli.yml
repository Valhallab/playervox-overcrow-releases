name: sdk-cli

# ADR 0004, M4–M5: the @overcrow/sdk package (typecheck, tests, reproducible
# npm pack) and the widget CLI `overcrow-widget` (build, tests, init → check
# → package → read_package end to end, deterministic .ocpkg), on Linux and
# Windows. The SDK's end-to-end test packages its Clock with the CLI, and
# the reference widgets of widgets/ are checked, packaged and unit-tested,
# and so are the examples of the creator documentation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-cli-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-cli:
    name: sdk-cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            target
          key: sdk-cli-${{ runner.os }}-rust-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sdk-cli-${{ runner.os }}-rust-1.98-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the CLI
        run: cargo build -p overcrow-widget-cli --locked
      - name: Lint the CLI
        if: runner.os == 'Linux'
        run: cargo clippy -p overcrow-widget-cli --all-targets --locked -- -D warnings
      - name: Test the CLI (unit, goldens, init → check → package → read_package)
        run: cargo test -p overcrow-widget-cli --all-targets --locked
      - name: Install the SDK's pinned toolchain
        working-directory: sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck the SDK
        working-directory: sdk
        run: npm run typecheck
      - name: Build the SDK
        working-directory: sdk
        run: npm run build
      - name: Test the SDK (its end-to-end Clock is packaged by the CLI)
        working-directory: sdk
        run: npm test
      - name: Require a reproducible npm package
        working-directory: sdk
        run: npm run pack:check
      - name: Check, package and unit-test the reference widgets
        # Built-in widgets on the public SDK (P2.4): type-checked against
        # this revision's SDK, packaged, and their logic unit-tested. Their
        # scenarios, fixtures and images are checked by the CLI's
        # reference_widgets test above; they play in OverCrow's headless
        # runtime, which this workflow runs once the CLI pins a published
        # one (docs/widget-testing.md).
        run: |
          set -eu
          node scripts/prepare-widgets.mjs
          # The built-ins' copies of widgets-shared/ are current.
          node scripts/sync-shared-widgets.mjs --check
          cli=$PWD/target/debug/overcrow-widget
          work=$(mktemp -d)
          for widget in widgets/*/; do
            test -f "$widget/view.ocml" || continue
            name=$(basename "$widget")
            "$cli" check "$widget" --deny-warnings
            "$cli" package "$widget" --out "$work/$name.ocpkg"
            "$cli" inspect "$work/$name.ocpkg"
          done
          node --test --test-concurrency=2 widgets/*/tests/*.test.mjs
      - name: Check the creator documentation
        # Generated tables current, both languages aligned, every code block
        # an excerpt of a project the CLI checks, packages and admits
        # (docs/content/README.md). Runs after prepare-widgets above.
        run: |
          set -eu
          node scripts/build-docs-content.mjs --check
          node --test --test-concurrency=2 tests/docs-content.test.mjs
      - name: Require a deterministic .ocpkg and a type-checked template
        run: |
          set -eu
          cli=target/debug/overcrow-widget
          work=$(mktemp -d)
          "$cli" package sdk/test/e2e/clock --no-typecheck --out "$work/a.ocpkg"
          "$cli" package sdk/test/e2e/clock --no-typecheck --out "$work/b.ocpkg"
          cmp "$work/a.ocpkg" "$work/b.ocpkg"
          "$cli" inspect "$work/a.ocpkg"
          "$cli" init "$work/counter" --template counter
          # @overcrow/sdk is not on npm yet: type against this checkout.
          mkdir -p "$work/counter/node_modules/@overcrow"
          cp -R sdk/node_modules/typescript "$work/counter/node_modules/typescript"
          mkdir "$work/counter/node_modules/@overcrow/sdk"
          cp -R sdk/package.json sdk/LICENSE sdk/dist "$work/counter/node_modules/@overcrow/sdk/"
          "$cli" check "$work/counter" --deny-warnings
          "$cli" package "$work/counter" --out "$work/counter.ocpkg"
