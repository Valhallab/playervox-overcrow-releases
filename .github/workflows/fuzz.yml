name: fuzz

# ADR 0004, section 8: 60 seconds per target on every pull request and push
# to main, and a long weekly run. Every parser and package verifier of the
# widget contract is a target.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - ocml
          - ocss
          - expression
          - validate_manifest
          - read_package
          - validate_compiled_view
          - open_envelope
          - creator_tools_zip
    env:
      # libFuzzer needs a nightly compiler; the date is pinned like the
      # stable toolchain.
      FUZZ_TOOLCHAIN: nightly-2026-09-26
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '2700' || '60' }}
      # Without allocation stacks ASan's memory stays flat over long runs
      # (a 10-minute run otherwise grows past 2 GiB); the parsers are safe
      # Rust, so crashes are panics whose stacks libFuzzer still prints.
      ASAN_OPTIONS: quarantine_size_mb=16:malloc_context_size=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo +"$FUZZ_TOOLCHAIN" install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ runner.os }}-
      - name: Seed the corpus from the conformance fixtures
        run: sh fuzz/seed-corpus.sh
      - name: Fuzz
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fuzz run -O "${{ matrix.target }}" -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -malloc_limit_mb=64 -max_len=16384
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
