name: policy

# ADR 0004, section 8: the repository policy checks, split out of the retired
# creator-kit workflow: the secret scanner and its regression smoke, and
# the links of every Markdown file.
on:
  push:
    branches: [main, candidate]
  pull_request:
    branches: [main, candidate]

permissions:
  contents: read

concurrency:
  group: policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify public repository policy and scanner regressions
        run: sh tests/check-policy-smoke.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Test the link check
        run: node --test tests/check-links.test.mjs
      - name: Check the links of every Markdown file
        run: node scripts/check-links.mjs
