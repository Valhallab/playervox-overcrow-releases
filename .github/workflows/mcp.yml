name: mcp

# @overcrow/mcp, the MCP server for widget creators (mcp/): lint and its
# security rules, the licenses of its dependencies, types, build, tests
# (both protocol eras, the pinned download against a local HTTPS server,
# the audit on the reference widgets) and a reproducible npm package, on
# Linux and Windows. The server ships the creator documentation and the
# reference widgets, so their changes run it too.
on:
  push:
    branches: [main, 'refacto/**']
    paths: ['mcp/**', 'docs/content/**', 'widgets/**', 'templates/**', 'sdk/src/generated/**', 'deny.toml', '.github/workflows/mcp.yml']
  pull_request:
    branches: [main]
    paths: ['mcp/**', 'docs/content/**', 'widgets/**', 'templates/**', 'sdk/src/generated/**', 'deny.toml', '.github/workflows/mcp.yml']

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    name: mcp (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned toolchain (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint and security rules
        if: runner.os == 'Linux'
        run: npm run lint
      - name: Licenses of every dependency
        run: npm run licenses
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Require a reproducible npm package
        if: runner.os == 'Linux'
        run: |
          umask 022
          npm run pack:check
      - name: The checkout stays clean
        run: git status --porcelain --untracked-files=no | { ! grep .; }
