[package]
name = "overcrow-widget-format"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Parsers of the widget source formats (ADR 0004, section 2): `view.ocml`
# compiled to `view.json`, and `style.ocss`. Pure Rust, no I/O and no
# `unsafe`, so the same code compiles into the host, the creator CLI and the
# Studio WebAssembly bundle. Every grammar and bound comes from
# `overcrow-widget-schema`.
#
# The OverCrow host pins this crate by Git revision and resolves these
# requirements with its own lockfile, so they stay semver ranges.
[dependencies]
overcrow-widget-schema = { path = "../overcrow-widget-schema" }
serde_json = "1.0.150"
