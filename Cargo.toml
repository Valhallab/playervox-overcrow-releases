[workspace]
members = [
    "cli",
    "crates/overcrow-widget-devchannel",
    "crates/overcrow-widget-format",
    "crates/overcrow-widget-scenario",
    "crates/overcrow-widget-schema",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
libc = "=0.2.186"
ring = "=0.17.14"
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "=3.23.0"

# Distribution builds of the creator CLI (`cargo build --profile dist`):
# smaller binaries without changing the default release profile.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
